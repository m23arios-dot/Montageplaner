<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Montageplaner</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#172033}.app{display:flex;min-height:100vh}.side{width:230px;background:#111827;color:#cbd5e1;padding:22px 14px;position:fixed;inset:0 auto 0 0}.brand{font-weight:800;color:white;font-size:20px;padding:5px 12px 28px}.mark{display:inline-grid;place-items:center;background:#2563eb;border-radius:9px;width:34px;height:34px;margin-right:9px}.nav button{display:block;width:100%;border:0;background:transparent;color:#aebbd0;text-align:left;padding:12px;border-radius:9px;font-size:14px;margin:4px 0}.nav button.active,.nav button:hover{background:#202c40;color:#fff}main{margin-left:230px;width:calc(100% - 230px);padding:25px 28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.eyebrow{font-size:11px;color:#718096;text-transform:uppercase;letter-spacing:.08em;font-weight:700}.title{font-size:27px;font-weight:800;margin-top:3px}.btn{border:1px solid #e4e9f0;background:#fff;padding:10px 14px;border-radius:9px;font-weight:700;margin-left:7px}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-bottom:18px}.kpi,.card{background:#fff;border:1px solid #e5e9f0;border-radius:14px}.kpi{padding:16px}.num{font-size:24px;font-weight:800;margin-top:7px}.lbl{font-size:11px;color:#718096}.layout{display:grid;grid-template-columns:1.55fr 1fr;gap:17px}.head{padding:16px 18px;border-bottom:1px solid #e8ecf2;display:flex;justify-content:space-between}.filters{padding:11px 15px;border-bottom:1px solid #e8ecf2}input,select{padding:9px;border:1px solid #e1e7ef;border-radius:8px;margin-right:7px}input{width:48%}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:11px 14px;text-align:left;border-bottom:1px solid #edf0f4}th{font-size:10px;color:#8792a4;text-transform:uppercase}.pill{padding:4px 7px;border-radius:99px;background:#eaf8ee;color:#16833a;font-weight:700;font-size:10px}.type-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.blue{background:#2563eb}.red{background:#dc2626}.yellow{background:#eab308}.type-label{font-size:10px;font-weight:800}.legend{display:flex;gap:12px;align-items:center;font-size:10px;color:#667085;margin-left:auto}.legend span{display:flex;align-items:center;gap:4px}.window{font-weight:800}.special{color:#7c3aed}.jobbox{border-left:4px solid #2563eb}.jobbox.redline{border-left-color:#dc2626}.jobbox.yellowline{border-left-color:#eab308}.tag{display:inline-block;padding:3px 6px;border-radius:6px;font-size:9px;font-weight:800;margin-left:6px}.tag.blueTag{background:#eaf2ff;color:#1d4ed8}.tag.redTag{background:#feecec;color:#b91c1c}.tag.yellowTag{background:#fff8d8;color:#9a7400}.tabs{padding:11px;border-bottom:1px solid #e8ecf2}.tab{padding:8px 11px;border:1px solid #e2e7ee;background:#fff;border-radius:8px;font-weight:700}.tab.active{background:#eff5ff;color:#1d4ed8;border-color:#bfd3ff}.route{padding:16px}.routehead{display:flex;justify-content:space-between;margin-bottom:14px}.region{font-size:10px;background:#eff5ff;color:#2563eb;padding:5px 7px;border-radius:99px;font-weight:800}.stop{position:relative;padding-left:30px;margin-bottom:4px}.stop:before{content:"";position:absolute;left:5px;top:11px;width:10px;height:10px;border-radius:50%;background:#2563eb;border:3px solid #dbe8ff}.box{border:1px solid #e5e9f0;border-radius:10px;padding:9px;background:#fbfcfe}.time{font-weight:800;font-size:11px}.customer{font-weight:800;margin-top:3px}.addr,.meta{font-size:11px;color:#718096}.drive{margin:3px 0 6px 30px;padding:7px 10px;border-left:2px dashed #cbd5e1;font-size:10px;color:#667085}.notice{margin-top:12px;background:#eef6ff;color:#2459a6;padding:10px;border-radius:9px;font-size:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.mini{border:1px solid #e5e9f0;padding:9px;border-radius:9px}.mini b{display:block}@media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:650px){.side{display:none}main{margin:0;width:100%;padding:14px}.kpis{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}.layout{display:block}.card+ .card{margin-top:14px}}
</style><body><div class="app"><aside class="side"><div class="brand"><span class="mark">M</span>Montageplaner</div><div class="nav"><button class="active">▦ Dashboard</button><button>▤ Aufträge</button><button>● Teams</button><button>◷ Tagesplan</button><button>▥ Statistiken</button><button>⚙ Einstellungen</button></div></aside><main><div class="top"><div><div class="eyebrow">Montag · 21. September 2026</div><div class="title" id="title">Tagesübersicht</div></div><div><button class="btn">＋ Neuer Auftrag</button><button class="btn primary" onclick="opt()">✦ Plan optimieren</button></div></div><div class="kpis"><div class="kpi">▣<div class="num">18</div><div class="lbl">Aufträge</div></div><div class="kpi">●<div class="num">3</div><div class="lbl">Teams</div></div><div class="kpi">⌂<div class="num">13:30 h</div><div class="lbl">Montagezeit</div></div><div class="kpi">▸<div class="num">118 km</div><div class="lbl">Fahrstrecke · Demo</div></div><div class="kpi">◷<div class="num">92%</div><div class="lbl">Tagesziel</div></div></div><div class="layout"><section class="card"><div class="head"><b>Aufträge</b><div class="legend"><span><i class="type-dot blue"></i>Freistehend</span><span><i class="type-dot red"></i>Einbau</span><span><i class="type-dot yellow"></i>Lieferung</span></div></div><div class="filters"><input placeholder="Kunde oder Adresse suchen…"><select><option>Alle Teams</option><option>Team 1</option><option>Team 2</option><option>Team 3</option></select></div><table><thead><tr><th>#</th><th>Kunde / Adresse</th><th>Fenster</th><th>Team</th><th>Status</th></tr></thead><tbody id="orders"></tbody></table></section><section class="card"><div class="tabs"><button class="tab active" onclick="team(1,this)">Team 1</button><button class="tab" onclick="team(2,this)">Team 2</button><button class="tab" onclick="team(3,this)">Team 3</button></div><div id="route"></div></section></div></main></div><script>
const T={1:{r:"Salzgitter · Nord",s:[
["08:00–09:30","Müller","Chemnitzer Straße 18, 38226 Salzgitter","","Freistehend","Waschmaschine","blue","08–11"],
["09:38–10:38","Schneider","Berliner Straße 42, 38226 Salzgitter","8,4 km · 8 min","Einbau","Geschirrspüler","red","08–11"],

function drawOrders(){let n=1,s='';Object.values(T).forEach((t,i)=>t.s.forEach(x=>{s+=`<tr><td>${n++}</td><td><b><span class="type-dot ${x[6]}"></span>${x[1]}</b><br><span class="addr">${x[2]}</span><br><span class="tag ${x[6]}Tag">${x[5]}</span></td><td><span class="window ${x[7].includes(':')?'special':''}">${x[7]}</span></td><td>Team ${i+1}</td><td><span class="pill">Geplant</span></td></tr>`}));document.getElementById('orders').innerHTML=s}
function team(n,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');let t=T[n],s=`<div class="route"><div class="routehead"><div><b>Team ${n}</b><div class="addr">${t.r} · 6 Aufträge</div></div><span class="region">Gebiet gebündelt</span></div>`;t.s.forEach((x,i)=>{if(i)s+=`<div class="drive">↳ <b>Fahrt</b> · ${x[3]}</div>`;s+=`<div class="stop"><div class="box jobbox ${x[6]==='red'?'redline':x[6]==='yellow'?'yellowline':''}"><div class="time">${x[0]} <span class="tag ${x[6]}Tag">${x[5]}</span></div><div class="customer">${x[1]}</div><div class="addr">${x[2]}</div><div class="meta">${x[4]} · Fenster ${x[7]}</div></div></div>`});s+=`<div class="notice">Gebiet zuerst bündeln, danach Fensterzeit, Montageart und Reihenfolge. Fahrdaten sind im Prototyp Demo-Werte.</div><div class="stats"><div class="mini"><b>~4,5 h</b><span>Montage</span></div><div class="mini"><b>~40 km</b><span>Fahrt</span></div><div class="mini"><b>1</b><span>Hauptgebiet</span></div></div></div>`;document.getElementById('route').innerHTML=s}
function opt(){document.getElementById('title').textContent='Plan optimiert';setTimeout(()=>document.getElementById('title').textContent='Tagesübersicht',1400)}
drawOrders();team(1,document.querySelector('.tab'));
</script></body></html>
